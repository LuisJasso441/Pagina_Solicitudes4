services:
  web:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: verden_web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html/Pagina_Solicitudes4
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      DB_HOST: db
      DB_NAME: solicitudes_ti
      DB_USER: root
      DB_PASS: root
      # SMTP - Desarrollo (MailHog captura todo, sin auth ni TLS)
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_ENCRYPTION: "none"
      SMTP_FROM_EMAIL: "no-reply@verden.local"
      SMTP_FROM_NAME: "Portal Verden (DEV)"
      SMTP_DEBUG: "0"
      # Correos de contacto para el footer de las plantillas
      # (dejar en blanco los emails si no quieres mostrar ese contacto)
      SMTP_CONTACTO_1_EMAIL: "coord.sistemas@grupoverden.com"
      SMTP_CONTACTO_1_LABEL: "Coordinador de Sistemas"
      SMTP_CONTACTO_2_EMAIL: "auxiliar.sistemas@grupoverden.com"
      SMTP_CONTACTO_2_LABEL: "Auxiliar de Sistemas"
      SMTP_CONTACTO_3_EMAIL: "asist.sistemas@grupoverden.com"
      SMTP_CONTACTO_3_LABEL: "Auxiliar de Sistemas"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - verden_net
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: verden_db
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: solicitudes_ti
    command:
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - verden_net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: verden_pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - verden_net
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: verden_mail
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - verden_net
    restart: unless-stopped

volumes:
  db_data:

networks:
  verden_net:
    driver: bridge
